name: Rebase branch

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Branch to rebase"
        required: true
        default: "mod"

      base:
        description: "Base branch"
        required: true
        default: "main"

permissions:
  contents: write

jobs:
  rebase:
    runs-on: ubuntu-latest

    concurrency:
      group: rebase-${{ inputs.target }}
      cancel-in-progress: false

    steps:
      - name: Checkout target branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.target }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch branches
        run: |
          git fetch origin \
            "${{ inputs.base }}" \
            "${{ inputs.target }}"

      - name: Rebase
        run: |
          git rebase "origin/${{ inputs.base }}"

      - name: Push
        run: |
          git push --force-with-lease \
            origin \
            "HEAD:${{ inputs.target }}"
